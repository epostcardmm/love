<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ချစ်တယ်</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Padauk and Noto Sans Myanmar for crisp, romantic Burmese typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@600;700;800&family=Padauk:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Base styles for clean pastel aesthetic and smooth typography */
        body {
            font-family: 'Padauk', 'Noto Sans Myanmar', sans-serif;
            background: radial-gradient(circle at 50% 45%, #fff8fa 0%, #fff0f4 55%, #ffe6ee 100%);
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Seamless, frameless floating and heartbeat animation */
        @keyframes cuteFloat {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            25% {
                transform: translateY(-8px) rotate(-1.5deg);
            }
            75% {
                transform: translateY(-5px) rotate(1.5deg);
            }
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.08);
            }
            30% {
                transform: scale(0.98);
            }
            45% {
                transform: scale(1.05);
            }
            60% {
                transform: scale(1);
            }
        }

        @keyframes happySquish {
            0% { transform: scale(1, 1); }
            30% { transform: scale(1.22, 0.82); }
            55% { transform: scale(0.88, 1.16); }
            75% { transform: scale(1.08, 0.94); }
            100% { transform: scale(1, 1); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.25; transform: scale(0.8) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.25) rotate(18deg); }
        }

        @keyframes textRevealPop {
            0% {
                opacity: 0;
                transform: translateY(25px) scale(0.65);
                filter: blur(6px);
            }
            60% {
                opacity: 1;
                transform: translateY(-6px) scale(1.06);
                filter: blur(0px);
            }
            80% {
                transform: translateY(2px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes romanticGlow {
            0%, 100% {
                text-shadow: 0 6px 24px rgba(244, 63, 94, 0.25), 0 0 40px rgba(251, 113, 133, 0.18);
                transform: translateY(0px);
            }
            50% {
                text-shadow: 0 10px 32px rgba(244, 63, 94, 0.42), 0 0 55px rgba(251, 113, 133, 0.35);
                transform: translateY(-4px);
            }
        }

        @keyframes gentlePulseHint {
            0%, 100% { opacity: 0.65; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }

        .frameless-character {
            animation: cuteFloat 4.2s ease-in-out infinite;
            cursor: pointer;
            transition: filter 0.3s ease;
        }

        .frameless-character:hover {
            filter: drop-shadow(0 14px 26px rgba(244, 63, 94, 0.22));
        }

        .heart-body-pulse {
            transform-origin: 120px 125px;
            animation: heartBeat 2.2s ease-in-out infinite;
        }

        .squish-active {
            transform-origin: 120px 125px;
            animation: happySquish 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
        }

        .sparkle-1 { transform-origin: 42px 58px; animation: twinkle 2.4s ease-in-out infinite; }
        .sparkle-2 { transform-origin: 202px 66px; animation: twinkle 2.9s ease-in-out 0.8s infinite; }
        .sparkle-3 { transform-origin: 194px 176px; animation: twinkle 2.6s ease-in-out 1.4s infinite; }
        .sparkle-4 { transform-origin: 46px 172px; animation: twinkle 3.1s ease-in-out 0.4s infinite; }

        .love-text-gradient {
            background: linear-gradient(135deg, #ff3366 0%, #f43f5e 45%, #e11d48 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.55;
        }

        .love-text-revealed {
            animation: textRevealPop 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                       romanticGlow 3s ease-in-out 0.75s infinite;
        }

        .hint-pulse {
            animation: gentlePulseHint 2.2s ease-in-out infinite;
        }

        /* Floating particle styles */
        .burst-particle {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            will-change: transform, opacity;
        }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center relative px-4">

    <!-- Main Centered Frameless Stage -->
    <main class="flex flex-col items-center justify-center text-center z-10 w-full max-w-lg">
        
        <!-- Frameless Animated Cute Heart Character (No border, no card, no background frame) -->
        <div id="cuteTrigger" role="button" tabindex="0" aria-label="ချစ်စရာ အသည်းပုံလေးကို နှိပ်ပါ"
             class="frameless-character relative flex items-center justify-center p-2 focus:outline-none">
            
            <!-- Seamless Custom Animated SVG Character (GIF-like smooth loop) -->
            <svg id="cuteSvg" class="w-52 h-52 sm:w-64 sm:h-64 md:w-72 md:h-72 overflow-visible" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Soft romantic pastel gradients -->
                    <linearGradient id="heartGrad" x1="50" y1="40" x2="190" y2="200" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#FF8FA3"/>
                        <stop offset="50%" stop-color="#FF5C8A"/>
                        <stop offset="100%" stop-color="#F43F5E"/>
                    </linearGradient>
                    <linearGradient id="heartHighlight" x1="75" y1="60" x2="120" y2="115" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
                        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                    </linearGradient>
                    <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#FF2A5F" stop-opacity="0.55"/>
                        <stop offset="100%" stop-color="#FF2A5F" stop-opacity="0"/>
                    </radialGradient>
                </defs>

                <!-- Ambient Floating Sparkles around the frameless character -->
                <g class="sparkle-1">
                    <path d="M42 48L44.5 55.5L52 58L44.5 60.5L42 68L39.5 60.5L32 58L39.5 55.5L42 48Z" fill="#FFB3C6"/>
                </g>
                <g class="sparkle-2">
                    <path d="M202 56L204.2 62.8L211 65L204.2 67.2L202 74L199.8 67.2L193 65L199.8 62.8L202 56Z" fill="#FF8FA3"/>
                </g>
                <g class="sparkle-3">
                    <path d="M194 168L196 174L202 176L196 178L194 184L192 178L186 176L192 174L194 168Z" fill="#FFC2D1"/>
                </g>
                <g class="sparkle-4">
                    <circle cx="46" cy="172" r="3.5" fill="#FF8FA3"/>
                </g>

                <!-- Pulsing & Squishable Heart Character Group -->
                <g id="heartCharacterGroup" class="heart-body-pulse">
                    <!-- Main Plump Cute Heart Body -->
                    <path d="M120 198C120 198 36 146 36 88C36 60.5 57.8 40 84.5 40C100.8 40 114.2 48.2 120 60.2C125.8 48.2 139.2 40 155.5 40C182.2 40 204 60.5 204 88C204 146 120 198 120 198Z" 
                          fill="url(#heartGrad)"/>
                    
                    <!-- Glossy Highlight on Top Left Curve -->
                    <path d="M56 85C56 66 70 53 86 53C92 53 96 56 95 61C94 65 89 66 84 67C73 69 67 78 66 88C65.5 93 61 95 58 92C56.5 90.5 56 88 56 85Z" 
                          fill="url(#heartHighlight)"/>

                    <!-- Cute Little Arms -->
                    <path d="M43 114C31 111 25 119 29 127C33 134 45 132 52 126" stroke="#FF5C8A" stroke-width="8" stroke-linecap="round"/>
                    <path d="M197 114C209 111 215 119 211 127C207 134 195 132 188 126" stroke="#FF5C8A" stroke-width="8" stroke-linecap="round"/>

                    <!-- Kawaii Face: Rosy Cheeks -->
                    <ellipse cx="83" cy="118" rx="13" ry="8" fill="url(#cheekBlush)"/>
                    <ellipse cx="157" cy="118" rx="13" ry="8" fill="url(#cheekBlush)"/>

                    <!-- Kawaii Face: Eyes (Default cute eyes) -->
                    <g id="eyesDefault">
                        <circle cx="94" cy="105" r="7.5" fill="#4A1525"/>
                        <circle cx="91.5" cy="102.5" r="2.6" fill="#FFFFFF"/>
                        <circle cx="96" cy="107" r="1.2" fill="#FFFFFF"/>

                        <circle cx="146" cy="105" r="7.5" fill="#4A1525"/>
                        <circle cx="143.5" cy="102.5" r="2.6" fill="#FFFFFF"/>
                        <circle cx="148" cy="107" r="1.2" fill="#FFFFFF"/>
                    </g>

                    <!-- Kawaii Face: Happy Closed Arcs (Shown when clicked!) -->
                    <g id="eyesHappy" class="hidden">
                        <path d="M85 106C88 99 99 99 102 106" stroke="#4A1525" stroke-width="4.5" stroke-linecap="round"/>
                        <path d="M138 106C141 99 152 99 155 106" stroke="#4A1525" stroke-width="4.5" stroke-linecap="round"/>
                    </g>

                    <!-- Kawaii Face: Cute Little Smile -->
                    <path id="mouthDefault" d="M111 116C114 121 126 121 129 116" stroke="#4A1525" stroke-width="4" stroke-linecap="round"/>
                    <path id="mouthHappy" class="hidden" d="M109 114C112 126 128 126 131 114Z" fill="#FF2A5F" stroke="#4A1525" stroke-width="3" stroke-linejoin="round"/>
                </g>
            </svg>
        </div>

        <!-- Subtle Tap Hint (Visible before first tap) -->
        <p id="tapHint" class="hint-pulse mt-2 text-rose-400/90 text-base sm:text-lg font-semibold tracking-wide transition-opacity duration-500">
            (နှိပ်ကြည့်ပါ)
        </p>

        <!-- Large Romantic Burmese Text Reveal Container -->
        <div id="loveMessageContainer" class="min-h-[110px] sm:min-h-[130px] flex flex-col items-center justify-center mt-1">
            <h1 id="loveText" 
                class="hidden love-text-gradient text-6xl sm:text-7xl md:text-8xl font-extrabold tracking-wide select-none px-4 py-2">
                LOL ဘာတွေမျှော်လင့်နေတာလည်း (File ကဝယ်မှရပါမယ်)
            </h1>
        </div>

    </main>

    <script>
        (function () {
            const trigger = document.getElementById('cuteTrigger');
            const heartGroup = document.getElementById('heartCharacterGroup');
            const eyesDefault = document.getElementById('eyesDefault');
            const eyesHappy = document.getElementById('eyesHappy');
            const mouthDefault = document.getElementById('mouthDefault');
            const mouthHappy = document.getElementById('mouthHappy');
            const tapHint = document.getElementById('tapHint');
            const loveText = document.getElementById('loveText');

            let isRevealed = false;
            let expressionTimeout = null;

            // Romantic pastel & vibrant heart colors for particle bursts
            const heartColors = [
                '#FF2A5F',
                '#FF5C8A',
                '#FF8FA3',
                '#F43F5E',
                '#FB7185',
                '#FDA4AF',
                '#FFB3C6'
            ];

            /**
             * Spawns a burst of floating mini hearts and sparkles around the click/center point
             */
            function createHeartBurst(originX, originY, count = 24) {
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'burst-particle';

                    const isSparkle = i % 4 === 0;
                    const color = heartColors[Math.floor(Math.random() * heartColors.length)];
                    const size = isSparkle ? (Math.random() * 12 + 10) : (Math.random() * 18 + 14);

                    if (isSparkle) {
                        particle.innerHTML = `
                            <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none">
                                <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z" fill="${color}"/>
                            </svg>
                        `;
                    } else {
                        particle.innerHTML = `
                            <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="${color}"/>
                            </svg>
                        `;
                    }

                    // Position particle near the character center or tap location
                    const startX = originX + (Math.random() - 0.5) * 40;
                    const startY = originY + (Math.random() - 0.5) * 40;
                    particle.style.left = `${startX}px`;
                    particle.style.top = `${startY}px`;

                    document.body.appendChild(particle);

                    // Radial burst trajectory with gentle upward float
                    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.45;
                    const velocity = Math.random() * 140 + 75;
                    const destX = Math.cos(angle) * velocity;
                    const destY = Math.sin(angle) * velocity - (Math.random() * 90 + 40);
                    const rotation = (Math.random() - 0.5) * 90;
                    const duration = Math.random() * 600 + 850;

                    const animation = particle.animate([
                        {
                            transform: 'translate(-50%, -50%) scale(0.2) rotate(0deg)',
                            opacity: 1
                        },
                        {
                            transform: `translate(calc(-50% + ${destX * 0.65}px), calc(-50% + ${destY * 0.65}px)) scale(1.15) rotate(${rotation * 0.6}deg)`,
                            opacity: 1,
                            offset: 0.55
                        },
                        {
                            transform: `translate(calc(-50% + ${destX}px), calc(-50% + ${destY}px)) scale(0.75) rotate(${rotation}deg)`,
                            opacity: 0
                        }
                    ], {
                        duration: duration,
                        easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                        fill: 'forwards'
                    });

                    animation.onfinish = () => {
                        particle.remove();
                    };
                }
            }

            /**
             * Triggers cute squish bounce and happy facial expression on the character
             */
            function animateCharacterReaction() {
                // Restart squish animation cleanly
                heartGroup.classList.remove('squish-active');
                void heartGroup.offsetWidth; // Force reflow
                heartGroup.classList.add('squish-active');

                // Switch to joyful expression
                eyesDefault.classList.add('hidden');
                mouthDefault.classList.add('hidden');
                eyesHappy.classList.remove('hidden');
                mouthHappy.classList.remove('hidden');

                clearTimeout(expressionTimeout);
                expressionTimeout = setTimeout(() => {
                    heartGroup.classList.remove('squish-active');
                    eyesHappy.classList.add('hidden');
                    mouthHappy.classList.add('hidden');
                    eyesDefault.classList.remove('hidden');
                    mouthDefault.classList.remove('hidden');
                }, 1100);
            }

            /**
             * Handles click/tap interaction
             */
            function handleInteraction(event) {
                const rect = trigger.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                // Use pointer coordinates if available, otherwise center of character
                const burstX = (event && event.clientX) ? event.clientX : centerX;
                const burstY = (event && event.clientY) ? event.clientY : centerY;

                // Trigger joyful animation & heart burst
                animateCharacterReaction();
                createHeartBurst(burstX, burstY, isRevealed ? 22 : 30);

                // First tap: hide hint and reveal "LOL ထီးကြည့်တာလား"
                if (!isRevealed) {
                    isRevealed = true;
                    tapHint.style.opacity = '0';
                    setTimeout(() => {
                        tapHint.classList.add('hidden');
                    }, 300);

                    loveText.classList.remove('hidden');
                    loveText.classList.add('love-text-revealed');
                } else {
                    // Subsequent taps: extra celebratory heart burst + subtle bounce on the text
                    loveText.style.transform = 'scale(1.08)';
                    setTimeout(() => {
                        loveText.style.transform = '';
                    }, 220);
                }
            }

            // Support click, touch, and keyboard accessibility
            trigger.addEventListener('click', handleInteraction);
            trigger.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleInteraction();
                }
            });
        })();
    </script>
</body>
</html>
