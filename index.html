<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe Love</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html { 
            min-height: 100vh; 
            margin: 0; 
            overflow-y: auto; 
        }
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            /* Clean & Aesthetic Sky Blue Grid Background */
            background-color: #f0f8ff;
            background-image: 
                linear-gradient(to right, rgba(135, 206, 235, 0.35) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(135, 206, 235, 0.35) 1px, transparent 1px);
            background-size: 28px 28px;
            font-family: sans-serif;
            padding: 20px 10px;
        }
        .container { 
            width: 100%;
            max-width: 360px; 
            height: auto;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.85); 
            border-radius: 30px; 
            text-align: center; 
            padding: 20px; 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(135, 206, 235, 0.8);
            box-shadow: 0 20px 50px rgba(2, 119, 189, 0.18);
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center;
        }
        
        .container::-webkit-scrollbar {
            width: 4px;
        }
        .container::-webkit-scrollbar-thumb {
            background: rgba(2, 136, 209, 0.4);
            border-radius: 10px;
        }

        .btn-container { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; width: 100%; }
        .btn { 
            padding: 12px; border: none; border-radius: 15px; cursor: pointer; 
            font-weight: bold; transition: all 0.2s ease;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.95);
        }

        /* ခလုတ်တစ်ခုချင်းစီအတွက် အရောင်ကွဲများ */
        .btn-1 { background: rgba(144, 202, 249, 0.85); color: #0d47a1; } /* မိုးပြာဖျော့ */
        .btn-2 { background: rgba(129, 212, 250, 0.85); color: #01579b; } /* အပြာနု */
        .btn-3 { background: rgba(79, 195, 247, 0.85); color: #003c8f; }  /* မိုးပြာရောင် */
        .btn-4 { background: rgba(179, 229, 252, 0.9); color: #0277bd; }  /* အပြာစိုဖျော့ */

        h3, p {
            color: #01579b !important;
        }
        #warning { color: #e65100; font-size: 14px; margin: 8px 0; min-height: 20px; font-weight: bold; }
        #page2 { display: none; }
        img { 
            width: 200px; 
            height: 200px; 
            object-fit: cover; 
            border-radius: 10px; 
            border: 2px solid rgba(135, 206, 235, 0.9); 
            box-shadow: 0 8px 20px rgba(2, 119, 189, 0.18);
        }
        .highlight { font-size: 20px; color: #0288d1; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="page1">
    <h3 style="margin-top: 0;">ဟိတ်.. အဲ့ဘက်မှာအေးလား<br>ဒီဘက်မှာတော့ ချစ်လိုက်တာတုန်နေတာပဲ<br>ပြန်ချစ်ပါလား နွေးထွေးပေးမယ်လေ</h3>
    <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGJtczRjM3p4bGRnYzg3MDg1dGxscGRyN3l3bGsyMDRpOTY1ZmF1ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/brHaCdJqCXijm/giphy.gif" alt="Rain">
    <div id="warning"></div>
    <div class="btn-container" id="btnBox">
        <button class="btn btn-1" onclick="handleWrong('မအေးဘူး')">မအေးဘူး</button>
        <button class="btn btn-2" onclick="handleWrong('အေးတယ်')">အေးတယ်</button>
        <button class="btn btn-3" onclick="nextPage('ချစ်တယ်')">ချစ်တယ်</button>
        <button class="btn btn-4" onclick="handleWrong('မဖြေဘူး')">မဖြေဘူး</button>
    </div>
</div>

<div class="container" id="page2">
    <h3 style="margin-top: 0;">Yayy.. အဖြေရပြီဗျို့...ဖိတ်စာသွားရိုက်ထားလိုက်တော့မယ်နော်🩵</h3>
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExbHpsZnYzanhjcnA1YjhyNmkyYWN5cmhyYTEzZWtkaW5seXNsaW0wdSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/dxAw1xsUcd4NW/giphy.gif" alt="Love">
    <p style="margin: 10px 0 5px 0;">Picked - <span class="highlight" id="answerDisplay"></span></p>
    <p style="margin-top: 0; font-size: 14px;">အတည်ပြန်ချစ်ပေးပါတော့ကွာ မင်းပြန်ချစ်မယ့်နေ့ကိုမျော်နေတာပါကွာ ပြန်ချစ်ပါတော့နော်.. အများကြီးနွေးထွေးပေးမှာပါ🩵</p>
    
    <!-- ဒုတိယစာမျက်နှာအောက်ဆုံးတွင် ထည့်သွင်းပေးထားသော "တကယ်ချစ်တယ်" ခလုတ် -->
    <div class="btn-container" style="margin-top: 5px;">
        <button class="btn" style="background: rgba(3, 169, 244, 0.85); color: white;" onclick="sendRealLoveEmail()">💌 တကယ်ချစ်တယ် (Confirm)</button>
    </div>
</div>

<script>
    const warnings = ["သေချာပြီလား?", "နောက်တစ်ခါ ထပ်စဉ်းစားဦးလေ", "အဖြေမှန် ရှာကြည့်ပါဦး", "မဟုတ်သေးဘူးနော်", "ပြန်ရွေးပါဦး", "ဟင့်အင်း... အဲ့ဒါမဟုတ်ဘူး"];

    const clickCounts = {
        "မအေးဘူး": 0,
        "အေးတယ်": 0,
        "မဖြေဘူး": 0,
        "ချစ်တယ်": 0
    };

    // Formspree Endpoint URL (သင့်ရဲ့ Formspree Link ကို ဤနေရာတွင် ထည့်ပါ)
    const FORMSPREE_ENDPOINT = ""; 

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playClickSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const now = audioCtx.currentTime;

        if (type === 'wrong') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(260, now + 0.14);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.14);
        } else if (type === 'love') {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + i * 0.08);

                gain.gain.setValueAtTime(0.22, now + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.08);
                osc.stop(now + i * 0.08 + 0.35);
            });
        }
    }

    function handleWrong(val) {
        playClickSound('wrong');

        if (clickCounts.hasOwnProperty(val)) {
            clickCounts[val]++;
        }

        document.getElementById('warning').innerText = warnings[Math.floor(Math.random() * warnings.length)];
        const box = document.getElementById('btnBox');
        const btns = Array.from(box.children);
        btns.sort(() => Math.random() - 0.5);
        btns.forEach(b => box.appendChild(b));
    }

    function nextPage(val) {
        playClickSound('love');

        if (clickCounts.hasOwnProperty(val)) {
            clickCounts[val]++;
        }

        sendToFormspree(val, "ပထမအကြိမ် ဝင်ရောက်ဖြေဆိုခြင်း");

        document.getElementById('page1').style.display = 'none';
        document.getElementById('page2').style.display = 'flex';
        document.getElementById('answerDisplay').innerText = val;
    }

    function sendRealLoveEmail() {
        playClickSound('love');
        alert("💖 ကျေးဇူးပါဗျာ... သင့်ရဲ့ အတည်ပြုချက်ကို အောင်မြင်စွာ ပို့လိုက်ပါပြီ 🩵");
        
        if (!FORMSPREE_ENDPOINT || FORMSPREE_ENDPOINT.includes("YOUR_FORM_ID")) {
            console.log("Formspree URL ထည့်သွင်းရန် လိုအပ်ပါသည်။");
            return;
        }

        const payload = {
            "Message": "❤️ ဟေး.. တစ်ဖက်လူက 'တကယ်ချစ်တယ်' ဆိုတဲ့ ခလုတ်ကိုနှိပ်ပြီး အတည်ပြုလိုက်ပါပြီ!",
            "Submitted At": new Date().toLocaleString()
        };

        fetch(FORMSPREE_ENDPOINT, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify(payload)
        }).catch(error => console.error("Error:", error));
    }

    function sendToFormspree(finalAnswer, note = "") {
        if (!FORMSPREE_ENDPOINT || FORMSPREE_ENDPOINT.includes("YOUR_FORM_ID")) return;

        const payload = {
            "Status": note,
            "Final Answer": finalAnswer,
            "မအေးဘူး နှိပ်သည့်အကြိမ်": clickCounts["မအေးဘူး"],
            "အေးတယ် နှိပ်သည့်အကြိမ်": clickCounts["အေးတယ်"],
            "မဖြေဘူး နှိပ်သည့်အကြိမ်": clickCounts["မဖြေဘူး"],
            "ချစ်တယ် နှိပ်သည့်အကြိမ်": clickCounts["ချစ်တယ်"],
            "Submitted At": new Date().toLocaleString()
        };

        fetch(FORMSPREE_ENDPOINT, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify(payload)
        }).catch(error => console.error(error));
    }
</script>

</body>
</html>
