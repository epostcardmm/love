
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma & Mg | Telegram Chat</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg,#172b3b,#263e55,#152a3c);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  padding: 20px;
}

/* PHONE */
.phone {
  width: 375px;
  max-width: 100%;
  height: 780px;
  max-height: 92vh;
  background: #e6ebef;
  border: 8px solid #101820;
  border-radius: 38px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 25px 70px #0008;
}

/* HEADER */
.header {
  background: #527da3;
  color: white;
  padding: 15px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 5px #0002;
  z-index: 2;
}

.back {
  font-size: 23px;
}

.avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ffd6e7,#ff9cba);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  color: #70435a;
  flex-shrink: 0;
}

.profile {
  flex: 1;
}

.profile h3 {
  font-size: 17px;
  font-weight: 600;
}

.profile p {
  font-size: 12px;
  color: #e0efff;
  margin-top: 4px;
}

.header-icons {
  font-size: 20px;
  display: flex;
  gap: 15px;
}

/* CHAT BACKGROUND */
.chat {
  flex: 1;
  padding: 18px 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background-color: #dce7ed;
  background-image:
    radial-gradient(#a6bac6 0.8px,transparent 0.8px);
  background-size: 20px 20px;
  scroll-behavior: smooth;
}

.date {
  align-self: center;
  background: #9aabb6;
  color: white;
  font-size: 11px;
  padding: 6px 13px;
  border-radius: 20px;
  margin-bottom: 8px;
}

/* MESSAGE */
.message {
  max-width: 83%;
  padding: 9px 11px 6px;
  font-size: 14px;
  line-height: 1.5;
  border-radius: 13px;
  position: relative;
  animation: appear .35s ease;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.left {
  align-self: flex-start;
  background: white;
  border-bottom-left-radius: 3px;
  color: #222;
}

.right {
  align-self: flex-end;
  background: #d3f0ce;
  border-bottom-right-radius: 3px;
  color: #222;
}

.sender {
  color: #4b91bb;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 3px;
}

.meta {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: #839099;
  margin-top: 3px;
}

.tick {
  color: #3995d4;
  font-weight: bold;
  font-size: 13px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px) scale(.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* TYPING */
.typing {
  display: none;
  align-self: flex-start;
  background: white;
  padding: 12px 15px;
  border-radius: 15px;
  gap: 4px;
}

.typing.show {
  display: flex;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #8295a4;
  animation: bounce .7s infinite alternate;
}

.dot:nth-child(2) { animation-delay: .2s; }
.dot:nth-child(3) { animation-delay: .4s; }

@keyframes bounce {
  to { transform: translateY(-5px); }
}

/* FOOTER */
.footer {
  background: #fff;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.input-box {
  flex: 1;
  border-radius: 25px;
  background: #f0f2f4;
  padding: 12px 15px;
  color: #89949d;
  font-size: 13px;
}

.send {
  width: 43px;
  height: 43px;
  background: #5298d0;
  border: none;
  color: white;
  border-radius: 50%;
  font-size: 19px;
  cursor: pointer;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 10px;
  background: #fff;
  border-top: 1px solid #eee;
}

.controls button {
  padding: 9px 15px;
  border: none;
  border-radius: 20px;
  background: #e6f2fc;
  color: #357fb8;
  font-weight: bold;
  cursor: pointer;
}

.controls button:active {
  transform: scale(.96);
}

@media(max-width: 450px) {
  body {
    padding: 0;
    background: #dce7ed;
  }

  .phone {
    width: 100%;
    height: 100dvh;
    max-height: 100dvh;
    border: none;
    border-radius: 0;
  }
}
</style>
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div class="header">
    <div class="back">‹</div>

    <div class="avatar">💗</div>

    <div class="profile">
      <h3>Ma & Mg 💞</h3>
      <p id="status">last seen recently</p>
    </div>

    <div class="header-icons">
      <span>📞</span>
      <span>⋮</span>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat" id="chat">

    <div class="date">Today</div>

    <div class="typing" id="typing">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span>😊</span>
    <div class="input-box">Message</div>
    <span>📎</span>
    <button class="send">➤</button>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button onclick="restartChat()">↻ Replay Chat</button>
    <button onclick="toggleChat()">⏸ Pause / Play</button>
  </div>

</div>

<script>

/* =================================
   MA & MG CHAT MESSAGES
   Edit your messages here!
================================= */

const messages = [

  {name:"Ma", side:"left", text:"မောင်ရေ 🥺💗", delay:1500},

  {name:"Mg", side:"right", text:"ဗျာ မမရေ ❤️", delay:1300},

  {name:"Ma", side:"left", text:"ဘာလုပ်နေလဲဟင်", delay:1600},

  {name:"Mg", side:"right", text:"မမကို သတိရနေတာလေ 🥹", delay:1800},

  {name:"Ma", side:"left", text:"ဟွန်း တကယ်လား 🤭", delay:1500},

  {name:"Mg", side:"right", text:"တကယ်ပေါ့ဗျာ။ မမမရှိရင် မပျော်ဘူး 💗", delay:2200},

  {name:"Ma", side:"left", text:"အဲ့လိုလေးပြောရင် ချစ်ဖို့ကောင်းလိုက်တာ 🥺", delay:1900},

  {name:"Mg", side:"right", text:"မမကိုပဲ အချစ်ဆုံးပါ ❤️", delay:1700},

  {name:"Ma", side:"left", text:"မောင်က မမကို ဘယ်လောက်ချစ်လဲ", delay:1900},

  {name:"Mg", side:"right", text:"ရေတွက်လို့မရအောင် ချစ်တာပေါ့ 😘💕", delay:2000},

  {name:"Ma", side:"left", text:"အမြဲတမ်း အခုလိုပဲ ချစ်ပေးနော် 🥹", delay:1900},

  {name:"Mg", side:"right", text:"အမြဲတမ်း ချစ်ပေးမှာပါ မမရေ။ Promise! ❤️🫶", delay:2200},

  {name:"Ma", side:"left", text:"I Love You မောင်ရေ 💗", delay:1800},

  {name:"Mg", side:"right", text:"Love You More မမရေ ❤️❤️❤️", delay:2000},

];


/* =================================
   CHAT ENGINE
================================= */

const chat = document.getElementById("chat");
const typing = document.getElementById("typing");
const statusText = document.getElementById("status");

let index = 0;
let timer = null;
let paused = false;
let running = false;

function wait(ms) {
  return new Promise(resolve => {
    timer = setTimeout(resolve, ms);
  });
}

function createMessage(msg) {

  const bubble = document.createElement("div");

  bubble.className = "message " + msg.side;

  const sender = document.createElement("div");
  sender.className = "sender";
  sender.textContent = msg.name;

  const content = document.createElement("div");
  content.textContent = msg.text;

  const meta = document.createElement("div");
  meta.className = "meta";

  const now = new Date();
  const time = now.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });

  const timeText = document.createElement("span");
  timeText.textContent = time;

  meta.appendChild(timeText);

  if(msg.side === "right") {
    const tick = document.createElement("span");
    tick.className = "tick";
    tick.textContent = "✓✓";
    meta.appendChild(tick);
  }

  bubble.appendChild(sender);
  bubble.appendChild(content);
  bubble.appendChild(meta);

  chat.insertBefore(bubble, typing);

  chat.scrollTop = chat.scrollHeight;
}

async function playChat() {

  if(running) return;

  running = true;
  paused = false;

  while(index < messages.length && !paused) {

    const msg = messages[index];

    typing.classList.add("show");

    statusText.textContent =
      msg.name + " is typing...";

    await wait(msg.delay);

    if(paused) break;

    typing.classList.remove("show");

    createMessage(msg);

    index++;

    statusText.textContent = "online";

    await wait(700);
  }

  typing.classList.remove("show");

  if(index >= messages.length) {
    statusText.textContent = "last seen just now";
  }

  running = false;
}

function restartChat() {

  clearTimeout(timer);

  paused = true;
  running = false;
  index = 0;

  chat.querySelectorAll(".message").forEach(el => el.remove());

  typing.classList.remove("show");

  statusText.textContent = "online";

  setTimeout(() => {
    playChat();
  }, 500);
}

function toggleChat() {

  if(running) {
    paused = true;
    clearTimeout(timer);
    typing.classList.remove("show");
    statusText.textContent = "paused";
  } else {
    playChat();
  }
}

/* START AUTOMATIC CHAT */

setTimeout(() => {
  playChat();
}, 1200);

</script>

</body>
</html>
