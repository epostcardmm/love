<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Apply Times New Roman globally */
        * {
            font-family: 'Times New Roman', Times, 'Padauk', serif !important;
        }

        body {
            background-color: #f6efff;
            /* Aesthetic Double-Line Windowpane + Cross-Stitch Grid Design */
            background-image: 
                radial-gradient(circle at 0 0, rgba(147, 51, 234, 0.28) 1.5px, transparent 1.5px),
                linear-gradient(to right, rgba(168, 85, 247, 0.16) 1px, transparent 1px, transparent 6px, rgba(168, 85, 247, 0.08) 6px, rgba(168, 85, 247, 0.08) 7px, transparent 7px),
                linear-gradient(to bottom, rgba(168, 85, 247, 0.16) 1px, transparent 1px, transparent 6px, rgba(168, 85, 247, 0.08) 6px, rgba(168, 85, 247, 0.08) 7px, transparent 7px),
                linear-gradient(to right, rgba(255, 255, 255, 0.45) 50%, transparent 50%),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.45) 50%, transparent 50%),
                radial-gradient(circle at 20% 20%, rgba(233, 213, 255, 0.7) 0%, transparent 50%),
                linear-gradient(135deg, #fdfbff 0%, #f3e8ff 50%, #ead6ff 100%);
            background-size: 
                64px 64px,
                64px 64px,
                64px 64px,
                128px 128px,
                128px 128px,
                100% 100%,
                100% 100%;
            background-position: center center;
            overflow: hidden;
            height: 100vh;
            touch-action: manipulation;
        }

        /* Subtle decorative floating background frame */
        .bg-ornament-frame {
            position: fixed;
            inset: 14px;
            border: 1.5px dashed rgba(168, 85, 247, 0.32);
            border-radius: 24px;
            pointer-events: none;
            z-index: 1;
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.6);
        }

        .font-cursive, .font-serif-custom, .font-padauk { 
            font-family: 'Times New Roman', Times, 'Padauk', serif !important; 
        }

        /* NEW ENVELOPE REVEAL: 3D Spiral Magic Bloom & Orbit Glow */
        @keyframes magicEnvelopeBloom {
            0% { 
                transform: translate(-50%, 60%) scale(0.05) rotate(-540deg); 
                opacity: 0; 
                filter: blur(12px) brightness(1.6);
            }
            55% { 
                transform: translate(-50%, -46%) scale(1.14) rotate(10deg); 
                opacity: 1; 
                filter: blur(0px) brightness(1.1);
            }
            75% { 
                transform: translate(-50%, -40%) scale(0.95) rotate(-4deg); 
            }
            100% { 
                transform: translate(-50%, -42%) scale(1) rotate(0deg); 
                opacity: 1; 
                filter: blur(0px) brightness(1);
            }
        }

        @keyframes magicHoverLevitate {
            0%, 100% { transform: translate(-50%, -42%) translateY(0px) rotate(-1.5deg); }
            50% { transform: translate(-50%, -42%) translateY(-12px) rotate(2deg); }
        }

        @keyframes auraHaloSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.95); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.06); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(0.95); }
        }

        /* Main Butterfly Idle Hover & Flutter */
        @keyframes butterflyGentleSway {
            0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
            50% { transform: translateY(-9px) rotate(2.5deg) scale(1.04); }
        }

        .butterfly-idle {
            animation: butterflyGentleSway 3.2s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        .butterfly-idle:hover {
            transform: scale(1.08);
        }

        /* Main Butterfly Slow Gentle Fly Away Animation */
        @keyframes mainButterflyFlyAway {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            25% {
                transform: translate(-18px, 10px) scale(1.06) rotate(-10deg);
                opacity: 1;
            }
            65% {
                transform: translate(65px, -180px) scale(0.75) rotate(14deg);
                opacity: 0.85;
            }
            100% {
                transform: translate(150px, -420px) scale(0.3) rotate(28deg);
                opacity: 0;
            }
        }

        .butterfly-fly-away {
            animation: mainButterflyFlyAway 2.2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards !important;
            pointer-events: none;
        }

        /* Mini Flying Butterflies Slow Particle Styles */
        .flying-butterfly {
            position: fixed;
            pointer-events: none;
            z-index: 60;
            animation: miniButterflyScatter var(--fly-dur, 3.2s) cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            filter: drop-shadow(0 4px 8px rgba(147, 51, 234, 0.32));
        }

        .flying-butterfly-inner {
            display: block;
            animation: wingFlap 0.24s ease-in-out infinite alternate;
        }

        @keyframes wingFlap {
            0% { transform: scaleX(1) scaleY(1); }
            100% { transform: scaleX(0.38) scaleY(1.05); }
        }

        @keyframes miniButterflyScatter {
            0% {
                transform: translate(0, 0) scale(0.25) rotate(0deg);
                opacity: 0;
            }
            18% {
                opacity: 1;
                transform: translate(calc(var(--tx) * 0.18), calc(var(--ty) * 0.18)) scale(1) rotate(calc(var(--rot) * 0.5));
            }
            65% {
                opacity: 0.95;
                transform: translate(calc(var(--tx) * 0.68), calc(var(--ty) * 0.68)) scale(0.85) rotate(var(--rot));
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.45) rotate(calc(var(--rot) * 1.3));
                opacity: 0;
            }
        }

        .magic-envelope-stage {
            position: absolute;
            top: 52%;
            left: 50%;
            animation: magicEnvelopeBloom 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                       magicHoverLevitate 3.6s ease-in-out infinite 1.5s;
            cursor: pointer;
            transition: filter 0.3s ease;
            user-select: none;
            -webkit-user-drag: none;
        }

        .envelope-halo-ring {
            position: absolute;
            top: 44%;
            left: 50%;
            width: 215px;
            height: 215px;
            border-radius: 50%;
            border: 1.5px dashed rgba(168, 85, 247, 0.45);
            background: radial-gradient(circle, rgba(233, 213, 255, 0.55) 0%, rgba(255, 255, 255, 0) 70%);
            animation: auraHaloSpin 14s linear infinite;
            pointer-events: none;
            z-index: -1;
        }

        .envelope-halo-ring::before {
            content: '✦';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            color: #9333ea;
            font-size: 13px;
        }

        .envelope-halo-ring::after {
            content: '♥';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            color: #c084fc;
            font-size: 11px;
        }

        .magic-envelope-stage img {
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            background: transparent !important;
            width: 165px !important;
            filter: drop-shadow(0 12px 22px rgba(126, 34, 206, 0.28));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .magic-envelope-stage:hover img {
            transform: scale(1.06);
            filter: drop-shadow(0 0 24px rgba(168, 85, 247, 0.65));
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.92; transform: scale(0.97); }
            50% { opacity: 1; transform: scale(1.03); }
        }

        .click-hint { animation: pulseGlow 1.8s infinite; }

        /* Passcode Shake Animation on Wrong Entry */
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake-box {
            animation: shakeError 0.4s ease-in-out;
        }

        /* Liquid Glass Passcode Card */
        .glass-lock-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.85) 0%, rgba(245, 235, 255, 0.78) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(216, 180, 254, 0.85);
            box-shadow: 
                0 25px 50px -12px rgba(88, 28, 135, 0.25),
                inset 0 1px 1px rgba(255, 255, 255, 0.9);
        }

        .keypad-btn {
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(216, 180, 254, 0.75);
            transition: all 0.15s ease;
        }
        .keypad-btn:hover {
            background: #f3e8ff;
            border-color: #c084fc;
            transform: translateY(-1px);
        }
        .keypad-btn:active {
            transform: scale(0.92);
            background: #e9d5ff;
        }

        /* Romantic Lavender Stationery Paper Design */
        .paper-stationery {
            background: linear-gradient(165deg, #ffffff 0%, #fcf8ff 50%, #f5edff 100%);
            color: #3b2854;
            border: 2px solid #d8b4fe;
            box-shadow: 
                0 20px 45px rgba(88, 28, 135, 0.22),
                0 4px 12px rgba(168, 85, 247, 0.12),
                inset 0 0 0 6px #ffffff,
                inset 0 0 0 7.5px #e9d5ff;
            position: relative;
        }

        .paper-stationery::before {
            content: '✿';
            position: absolute;
            top: 14px;
            left: 18px;
            font-size: 14px;
            color: #c084fc;
            opacity: 0.7;
        }

        .ruled-paper-area {
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 31px,
                rgba(192, 132, 252, 0.22) 32px
            );
            line-height: 32px;
            padding-top: 2px;
        }

        .paper-stationery .title-text { color: #6b21a8; }
        .paper-stationery .heading-text { color: #7e22ce; }

        .sparkle {
            position: absolute;
            background: radial-gradient(circle, #c084fc 15%, rgba(216, 180, 254, 0.85) 60%, transparent 100%);
            border-radius: 50%; pointer-events: none;
            animation: floatUp var(--duration) linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.75; }
            80% { opacity: 0.75; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        .blurred-content { filter: blur(6px); pointer-events: none; transition: filter 0.5s ease; }

        /* Typing cursor effect */
        .typing-cursor::after {
            content: '|';
            animation: blink 0.7s infinite;
            color: #9333ea;
            font-weight: bold;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>

    <script>

        const SECRET_PASSCODE = "0000"; 
        // ==========================================

        let currentInput = "";
        let isButterflyFlying = false;

        const textData = {
            title: "Happy Anniversary",
            heading: "💜 Happy Anniversary, My Love! ✨",
            body: "ငါတို့နှစ်ယောက် အတူတူဖြတ်သန်းလာခဲ့တဲ့ အချိန်တွေအတွက် ကျေးဇူးအများကြီးတင်ပါတယ်။ အမြဲတမ်းနားလည်ပေးပြီး ချစ်ပေးလို့လည်း ကျေးဇူးပါ။ 💖\nရှေ့လျောက်လည်း အနားမှာ အမြဲရှိပေးပါရစေနော်\nအများကြီးဆက်ချစ်ပေးမယ်လို့ ကတိပေးပါတယ်နော်",
            sub: "May our love continue to grow stronger with each passing day! ✨",
            footerLeft: "With All My Love 💜",
            footerRight: "✨ Forever & Always ✨"
        };

        /* Slow Butterfly Flight Burst & Open Passcode */
        function triggerButterflyFlight(e) {
            if (isButterflyFlying) return;
            isButterflyFlying = true;

            const mainButterfly = document.getElementById('mainButterflyImg');
            const hintBadge = document.getElementById('butterflyHintBadge');
            const rect = mainButterfly.getBoundingClientRect();
            const originX = rect.left + rect.width / 2;
            const originY = rect.top + rect.height / 2;

            // Animate main butterfly flying away slowly
            mainButterfly.classList.remove('butterfly-idle');
            mainButterfly.classList.add('butterfly-fly-away');
            hintBadge.classList.add('opacity-0');

            // Spawn 18 slow-fluttering mini butterflies scattering outward
            const butterflyCount = 18;
            for (let i = 0; i < butterflyCount; i++) {
                const bWrapper = document.createElement('div');
                bWrapper.className = 'flying-butterfly';

                // Spread around the butterfly image center
                const offsetX = (Math.random() - 0.5) * 90;
                const offsetY = (Math.random() - 0.5) * 70;
                bWrapper.style.left = `${originX + offsetX}px`;
                bWrapper.style.top = `${originY + offsetY}px`;

                // Upward & outward slow flight trajectories
                const angle = (-Math.PI / 2) + (Math.random() - 0.5) * 2.4;
                const distance = 220 + Math.random() * 260;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 70;
                const rot = (Math.random() - 0.5) * 65;
                const duration = 2.6 + Math.random() * 1.4; // Slowed down (2.6s - 4.0s)
                const size = 24 + Math.random() * 22;

                bWrapper.style.setProperty('--tx', `${tx}px`);
                bWrapper.style.setProperty('--ty', `${ty}px`);
                bWrapper.style.setProperty('--rot', `${rot}deg`);
                bWrapper.style.setProperty('--fly-dur', `${duration}s`);
                bWrapper.style.animationDelay = `${Math.random() * 0.35}s`;

                const bInner = document.createElement('img');
                bInner.src = "https://i.ibb.co/r2RHJNg3/68ggg.png";
                bInner.className = 'flying-butterfly-inner';
                bInner.style.width = `${size}px`;
                bInner.style.height = 'auto';
                bInner.style.animationDuration = `${0.20 + Math.random() * 0.12}s`;

                bWrapper.appendChild(bInner);
                document.body.appendChild(bWrapper);

                setTimeout(() => {
                    bWrapper.remove();
                }, (duration + 0.5) * 1000);
            }

            // Open password modal smoothly after letting butterflies float upward
            setTimeout(() => {
                openPasswordModal();
            }, 1500);
        }

        function resetButterflyState() {
            isButterflyFlying = false;
            const mainButterfly = document.getElementById('mainButterflyImg');
            const hintBadge = document.getElementById('butterflyHintBadge');
            if (mainButterfly) {
                mainButterfly.classList.remove('butterfly-fly-away');
                mainButterfly.classList.add('butterfly-idle');
            }
            if (hintBadge) {
                hintBadge.classList.remove('opacity-0');
            }
        }

        /* Passcode Logic */
        function openPasswordModal() {
            const modal = document.getElementById('passwordModal');
            const box = document.getElementById('passwordBox');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100', 'pointer-events-auto');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');
            clearDigits();
        }

        function closePasswordModal() {
            const modal = document.getElementById('passwordModal');
            const box = document.getElementById('passwordBox');
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            resetButterflyState();
        }

        function closePasswordModalOnBg(e) {
            if (e.target.id === 'passwordModal') closePasswordModal();
        }

        function updatePinDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, idx) => {
                if (idx < currentInput.length) {
                    dot.classList.remove('bg-white', 'border-purple-400');
                    dot.classList.add('bg-purple-600', 'border-purple-600', 'scale-110');
                } else {
                    dot.classList.remove('bg-purple-600', 'border-purple-600', 'scale-110');
                    dot.classList.add('bg-white', 'border-purple-400');
                }
            });
        }

        function enterDigit(digit) {
            if (currentInput.length >= 4) return;
            document.getElementById('passErrorMsg').classList.add('opacity-0');
            currentInput += digit;
            updatePinDots();

            if (currentInput.length === 4) {
                setTimeout(verifyPasscode, 180);
            }
        }

        function deleteDigit() {
            currentInput = currentInput.slice(0, -1);
            document.getElementById('passErrorMsg').classList.add('opacity-0');
            updatePinDots();
        }

        function clearDigits() {
            currentInput = "";
            document.getElementById('passErrorMsg').classList.add('opacity-0');
            updatePinDots();
        }

        function verifyPasscode() {
            if (currentInput === SECRET_PASSCODE) {
                const modal = document.getElementById('passwordModal');
                const box = document.getElementById('passwordBox');
                modal.classList.remove('opacity-100', 'pointer-events-auto');
                modal.classList.add('opacity-0', 'pointer-events-none');
                box.classList.remove('scale-100');
                box.classList.add('scale-95');
                startExperience();
            } else {
                const box = document.getElementById('passwordBox');
                const err = document.getElementById('passErrorMsg');
                err.classList.remove('opacity-0');
                box.classList.remove('shake-box');
                void box.offsetWidth; // trigger reflow
                box.classList.add('shake-box');
                setTimeout(() => {
                    currentInput = "";
                    updatePinDots();
                }, 450);
            }
        }

        // Keyboard number support on PC
        document.addEventListener('keydown', (e) => {
            const passModal = document.getElementById('passwordModal');
            if (passModal.classList.contains('opacity-100')) {
                if (e.key >= '0' && e.key <= '9') enterDigit(e.key);
                if (e.key === 'Backspace') deleteDigit();
                if (e.key === 'Escape') closePasswordModal();
            }
        });

        /* Typing & Experience Logic */
        let typingTimeouts = [];

        function clearAllTyping() {
            typingTimeouts.forEach(t => clearTimeout(t));
            typingTimeouts = [];
        }

        function typeWriter(elementId, text, speed, callback) {
            const el = document.getElementById(elementId);
            el.innerHTML = "";
            el.classList.add('typing-cursor');
            let i = 0;

            function typeNextChar() {
                if (i < text.length) {
                    if (text.charAt(i) === '\n') {
                        el.innerHTML += '<br>';
                    } else {
                        el.innerHTML += text.charAt(i);
                    }
                    i++;
                    const timeout = setTimeout(typeNextChar, speed);
                    typingTimeouts.push(timeout);
                } else {
                    el.classList.remove('typing-cursor');
                    if (callback) callback();
                }
            }

            typeNextChar();
        }

        function startTypingSequence() {
            clearAllTyping();
            
            document.getElementById('titleText').innerHTML = "";
            document.getElementById('headingText').innerHTML = "";
            document.getElementById('bodyText').innerHTML = "";
            document.getElementById('subText').innerHTML = "";
            document.getElementById('footerLeft').innerHTML = "";
            document.getElementById('footerRight').innerHTML = "";

            typeWriter('titleText', textData.title, 60, () => {
                typeWriter('headingText', textData.heading, 40, () => {
                    typeWriter('bodyText', textData.body, 35, () => {
                        typeWriter('subText', textData.sub, 30, () => {
                            document.getElementById('footerLeft').innerHTML = textData.footerLeft;
                            document.getElementById('footerRight').innerHTML = textData.footerRight;
                        });
                    });
                });
            });
        }

        function startExperience() {
            const audio = document.getElementById('bgMusic');
            if (audio.src && audio.src !== window.location.href) {
                audio.play().catch(err => console.log("Audio play error", err));
            }
            const startScreen = document.getElementById('startScreen');
            const mainContent = document.getElementById('mainContent');
            startScreen.classList.add('opacity-0');
            setTimeout(() => {
                startScreen.style.display = 'none';
                mainContent.classList.remove('hidden');
                createSparkles();
            }, 500);
        }

        function createSparkles() {
            const container = document.getElementById('sparkle-container');
            if (!container) return;
            for (let i = 0; i < 35; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                const size = Math.random() * 6 + 3;
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                sparkle.style.left = `${Math.random() * 100}%`;
                sparkle.style.setProperty('--duration', `${Math.random() * 6 + 6}s`);
                sparkle.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(sparkle);
            }
        }

        function openWishCard() {
            const modal = document.getElementById('wishModal');
            const modalCard = document.getElementById('modalCard');
            const mainContent = document.getElementById('mainContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100', 'pointer-events-auto');
            modalCard.classList.remove('scale-90');
            modalCard.classList.add('scale-100');
            mainContent.classList.add('blurred-content');

            startTypingSequence();
        }

        function closeWishCard() {
            const modal = document.getElementById('wishModal');
            const modalCard = document.getElementById('modalCard');
            const mainContent = document.getElementById('mainContent');
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
            mainContent.classList.remove('blurred-content');
            closeExportCornerModal();
            clearAllTyping();
        }

        function closeWishCardOnBg(e) {
            if (e.target.id === 'wishModal') closeWishCard();
        }

        function openCornerFullModal(e) {
            if(e) e.stopPropagation();
            document.getElementById('exportCornerModal').classList.remove('hidden');
        }

        function closeExportCornerModal() {
            document.getElementById('exportCornerModal').classList.add('hidden');
        }
    </script>
</body>
</html>
