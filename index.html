<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex Lover</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Soft Pink Grid Background */
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #ffe4e9;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.7) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.7) 2px, transparent 2px);
            background-size: 25px 25px;
            overflow: hidden; 
            position: relative; 
        }
        
        .bg-heart { position: absolute; color: rgba(255, 143, 171, 0.3); font-size: 20px; animation: floatUp 6s linear infinite; bottom: -20px; z-index: 0; pointer-events: none; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; } }
        
        /* ပြင်ဆင်ထားသော Frame Design (Dashed Pink Glowing Frame) */
        .card-container { 
            position: relative; 
            width: 90%; 
            max-width: 400px; 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 28px; 
            box-shadow: 0 12px 35px rgba(255, 105, 180, 0.25), 0 0 15px rgba(255, 182, 193, 0.5); 
            padding: 30px; 
            text-align: center; 
            z-index: 10; 
            border: 3px dashed #ff8fa3;
            outline: 6px solid rgba(255, 204, 213, 0.5);
        }
        .gif-container { width: 150px; height: 150px; margin: 20px auto; }
        .gif-container img { width: 100%; height: 100%; border-radius: 15px; object-fit: cover; }
        .btn-group { position: relative; min-height: 80px; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
        button { padding: 12px 25px; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; transition: 0.2s ease; font-size: 16px; }
        
        .primary-btn, .secondary-btn { background: #ff758f; color: white; box-shadow: 0 4px 12px rgba(255, 117, 143, 0.3); }
        .primary-btn:hover, .secondary-btn:hover { background: #ff4d6d; }

        .fullscreen-active { position: fixed !important; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; border-radius: 0; font-size: 30px; }
        
        #captureArea {
            background: #fff0f5;
            border: 2px dashed #ffb3c1;
            border-radius: 18px;
            padding: 15px;
            text-align: center;
        }
        #captureArea h3 {
            color: #ff4d6d;
            margin-bottom: 12px;
            font-size: 18px;
        }
        .result-item {
            background: #ffffff;
            border: 1px solid #ffccd5;
            border-radius: 12px;
            padding: 10px 12px;
            margin: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            box-shadow: 0 3px 8px rgba(255, 117, 140, 0.08);
            gap: 4px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }
        .result-q {
            font-size: 13px;
            color: #444;
            flex: 1;
            padding-right: 8px;
            font-weight: 500;
        }
        .result-a {
            background: #ff758f;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }
        .result-no-count {
            font-size: 11px;
            color: #ff4d6d;
            font-weight: bold;
        }
        
        #sendingStatus { display: none; font-size: 14px; color: #ff4d6d; margin-top: 10px; font-weight: bold; }
        
        .heart-start-btn { cursor: pointer; animation: pulseBeat 1.2s infinite; margin: 15px auto; display: inline-block; user-select: none; }
        .heart-start-btn img { width: 140px; height: auto; display: block; border: none; outline: none; background: transparent; }
        @keyframes pulseBeat { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .burst-emoji {
            position: fixed;
            font-size: 26px;
            pointer-events: none;
            z-index: 99999;
            animation: burstAnim 0.8s ease-out forwards;
        }
        @keyframes burstAnim {
            0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="heartsContainer"></div>

    <div class="card-container" id="introScreen">
        <h2 style="color: #ff4d6d; margin-bottom: 10px;">Hello ရည်းစားဟောင်းလေး</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 5px;">Click The Heart</p>
        <div class="heart-start-btn" id="startHeartBtn">
            <img src="https://media.tenor.com/Wvf4fg8LJv8AAAAi/sorjo-boss.gif" alt="Heart GIF">
        </div>
    </div>

    <div class="card-container" id="mainCard" style="display: none;">
        <h2 id="questionText" style="color: #ff4d6d;">ပြန်လာပေးပါလား?</h2>
        <div class="gif-container"><img id="statusGif" src="https://media.tenor.com/uf4rihPX8ScAAAAi/happy-labour-day.gif"></div>
        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" class="primary-btn" onclick="handleInteraction(true)">ပြန်လာမယ်</button>
            <button id="noBtn" class="secondary-btn" onclick="handleInteraction(false)">မလာဘူး</button>
        </div>
        <div id="sendingStatus">အဖြေများကို ပို့ပေးနေပါသည်... 💌</div>
    </div>

    <div class="card-container" id="successScreen" style="display: none;">
        <div id="captureArea">
            <h3>💖 Our Love Agreement</h3>
            <div id="summaryList"></div>
        </div>
        <button class="primary-btn" style="width:100%; margin-top:20px;" onclick="saveToPNG()">Save As PNG 📸</button>
    </div>

    <script>
        const FORMSPREE_URL = ""; 
        
        const steps = [
            { question: "ပြန်လာပေးပါလား", yes: "ပြန်လာမယ်", no: "မလာဘူး", gif: "https://media.tenor.com/uf4rihPX8ScAAAAi/happy-labour-day.gif", type: "shrink" },
            { question: "အများကြီးသတိရလို့ပါ", yes: "ဟုတ်", no: "မယုံပါဘူး", gif: "https://media.tenor.com/1QTB9AnN7RQAAAAi/peach-goma.gif", type: "run" },
            { question: "အတည်ပြန်လာမှာလား", yes: "Yes", no: "No no", gif: "https://media1.tenor.com/m/xDxd1bVH4ccAAAAC/peach-peach-cat.gif", type: "fade" },
            { question: "ချစ်သေးတယ်မလား", yes: "ချစ်တယ်", no: "မချစ်ဘူး", gif: "https://media.tenor.com/7lw6gN-stFQAAAAi/peach-and-goma-peach-triste.gif", type: "fullscreen" }
        ];

        let currentStep = 0, yesScale = 1, noScale = 1, userAnswers = [];
        let noClickCounts = [0, 0, 0, 0];

        document.getElementById('startHeartBtn').onclick = function(e) {
            const rect = this.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            const emojis = ['❤️', '💖', '💕', '💘', '💓', '💗', '💞'];
            
            for (let i = 0; i < 22; i++) {
                let emojiEl = document.createElement('div');
                emojiEl.className = 'burst-emoji';
                emojiEl.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                let angle = Math.random() * Math.PI * 2;
                let distance = 70 + Math.random() * 110;
                let destX = Math.cos(angle) * distance;
                let destY = Math.sin(angle) * distance;
                
                emojiEl.style.left = `${x}px`;
                emojiEl.style.top = `${y}px`;
                emojiEl.style.setProperty('--dx', `${destX}px`);
                emojiEl.style.setProperty('--dy', `${destY}px`);
                
                document.body.appendChild(emojiEl);
                
                setTimeout(() => emojiEl.remove(), 800);
            }

            setTimeout(() => {
                document.getElementById('introScreen').style.display = 'none';
                document.getElementById('mainCard').style.display = 'block';
            }, 350);
        };

        function handleInteraction(isYes) {
            nextStep(isYes);
        }

        function nextStep(isYes) {
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.classList.remove('fullscreen-active');
            
            userAnswers.push({ 
                q: steps[currentStep].question, 
                a: isYes ? steps[currentStep].yes : steps[currentStep].no,
                noCount: noClickCounts[currentStep] 
            });
            
            currentStep++;
            if (currentStep < steps.length) {
                updateCard();
            } else {
                sendAnswersToFormspree();
            }
        }

        function handleNoClick() {
            noClickCounts[currentStep]++; 
            
            const step = steps[currentStep];
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            if (step.type === "shrink") { 
                yesScale += 0.3; yesBtn.style.transform = `scale(${yesScale})`; 
                noScale -= 0.2; noBtn.style.transform = `scale(${noScale})`; 
            }
            else if (step.type === "fade") noBtn.style.opacity = '0';
            else if (step.type === "fullscreen") yesBtn.classList.add('fullscreen-active');
        }

        function dodgeButton(e) {
            if (e) e.preventDefault();
            noClickCounts[currentStep]++; 
            
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'fixed';
            noBtn.style.zIndex = '1000';

            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        document.getElementById('noBtn').onclick = (e) => {
            if (steps[currentStep].type === "run") {
                dodgeButton(e);
            } else {
                handleNoClick();
            }
        };

        function updateCard() {
            const s = steps[currentStep];
            const noBtn = document.getElementById('noBtn');

            document.getElementById('questionText').innerText = s.question;
            document.getElementById('yesBtn').innerText = s.yes; 
            noBtn.innerText = s.no;
            document.getElementById('statusGif').src = s.gif;
            
            document.getElementById('yesBtn').style.transform = "scale(1)"; 
            noScale = 1; 
            noBtn.style.transform = "scale(1)"; 
            noBtn.style.opacity = "1"; 
            noBtn.style.position = 'static';
            noBtn.style.left = 'auto';
            noBtn.style.top = 'auto';
            
            noBtn.onmouseover = null;
            noBtn.ontouchstart = null;

            if (s.type === "run") {
                noBtn.onmouseover = dodgeButton;
                noBtn.ontouchstart = dodgeButton;
            }
        }

        function sendAnswersToFormspree() {
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('sendingStatus').style.display = 'block';

            let formData = {};
            userAnswers.forEach((item, index) => {
                formData[`မေးခွန်း ${index + 1}: ${item.q}`] = `${item.a} (ငြင်းခဲ့သည့်အကြိမ်ရေ: ${item.noCount} ကြိမ်)`;
            });

            fetch(FORMSPREE_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                showResult();
            })
            .catch(error => {
                console.error("Error sending form:", error);
                showResult();
            });
        }

        function showResult() {
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            document.getElementById('summaryList').innerHTML = userAnswers.map((item, i) => 
                `<div class="result-item">
                    <div class="result-row">
                        <span class="result-q">${i+1}. ${item.q}</span>
                        <span class="result-a">${item.a}</span>
                    </div>
                    <div class="result-no-count">❌ ငြင်းခဲ့သည့်အကြိမ်ရေ: ${item.noCount} ကြိမ်</div>
                </div>`
            ).join('');
        }

        function saveToPNG() {
            html2canvas(document.getElementById('captureArea')).then(canvas => {
                let link = document.createElement('a');
                link.download = 'Our_Love_Agreement.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        setInterval(() => {
            let h = document.createElement('div');
            h.className = 'bg-heart';
            h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            document.getElementById('heartsContainer').appendChild(h);
            setTimeout(() => h.remove(), 6000);
        }, 800);
    </script>
</body>
</html>
