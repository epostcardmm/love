<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❤️ ပြန်ချစ်ပါတော့နော် ❤️</title>
  <!-- Google Fonts for Myanmar Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-glow: #ff4b82;
      --secondary-glow: #ff758c;
      --accent-gold: #ffd700;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Soft Pink Theme Background Gradient Animation */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Padauk', 'Pyidaungsu', sans-serif;
      overflow: hidden;
      position: relative;
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ff758c, #ffaf7b, #ff6a88, #ff99ac);
      background-size: 400% 400%;
      animation: colorfulGradient 12s ease infinite;
    }

    @keyframes colorfulGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating Heart & Sparkle Particles */
    .floating-heart {
      position: fixed;
      font-size: 20px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 10px rgba(255, 75, 130, 0.8);
      pointer-events: none;
      animation: floatUp 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.4) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.9; }
      80% { opacity: 0.8; }
      100% {
        transform: translateY(-15vh) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }

    /* COMPLETELY FRAMELESS CONTAINER */
    .container {
      text-align: center;
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      padding: 20px;
      max-width: 500px;
      width: 90%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Glowing Headings */
    h2 {
      color: #fff;
      margin-bottom: 25px;
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.6;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.9),
                   0 0 25px var(--primary-glow),
                   0 2px 10px rgba(180, 20, 70, 0.4);
    }

    /* GIF Button Styling */
    .gif-btn {
      width: 210px;
      height: 210px;
      object-fit: contain;
      border: none;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 10px 25px rgba(255, 75, 130, 0.5));
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .gif-btn:hover {
      transform: scale(1.08) rotate(2deg);
      filter: drop-shadow(0 15px 35px rgba(255, 75, 130, 0.8));
    }

    /* Responsive Flex Button Group (Prevents Overlap) */
    .btn-group {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      width: 100%;
      flex-wrap: wrap; /* Yes ကြီးလာပါက No ကို အောက်သို့ ချပေးမည် */
    }

    .btn {
      padding: 14px 36px;
      font-size: 1.15rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
      position: relative;
      white-space: nowrap;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff4b82, #ff758c, #ff3366);
      background-size: 200% 200%;
      color: white;
      box-shadow: 0 8px 25px rgba(255, 75, 130, 0.6);
      animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px rgba(255, 75, 130, 0.5); }
      50% { box-shadow: 0 0 30px rgba(255, 75, 130, 0.9); }
      100% { box-shadow: 0 0 15px rgba(255, 75, 130, 0.5); }
    }

    .btn-no {
      background: linear-gradient(135deg, #a0aec0, #cbd5e0);
      color: #2d3748;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .btn-no:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #718096, #a0aec0);
      color: white;
    }

    /* Sad Text Popup Badge */
    .sad-text {
      position: fixed;
      color: #fff;
      font-weight: 700;
      font-size: 1.05rem;
      background: rgba(120, 30, 60, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 12px 22px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 15px rgba(255, 75, 130, 0.5);
      border: 1.5px solid rgba(255, 175, 189, 0.6);
      pointer-events: none;
      animation: popup 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 50;
      max-width: 290px;
      text-align: center;
    }

    @keyframes popup {
      0% { opacity: 0; transform: scale(0.4) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Falling GIF Container */
    .falling-container {
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      animation: fallDown 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      cursor: pointer;
      text-align: center;
      background: transparent;
    }

    @keyframes fallDown {
      0% { top: -200px; opacity: 0; }
      100% { top: 30%; opacity: 1; }
    }

    .falling-gif {
      width: 200px;
      height: auto;
      border: none;
      background: transparent;
      filter: drop-shadow(0 15px 30px rgba(255, 75, 130, 0.5));
      transition: transform 0.3s;
      animation: gentleBob 2s ease-in-out infinite alternate 2.2s;
    }

    @keyframes gentleBob {
      from { transform: translateY(0); }
      to { transform: translateY(-14px); }
    }

    .falling-gif:hover {
      transform: scale(1.1) rotate(3deg);
    }

    .click-hint {
      color: #fff;
      font-weight: 700;
      margin-top: 15px;
      font-size: 1.05rem;
      background: rgba(255, 75, 130, 0.9);
      backdrop-filter: blur(8px);
      padding: 8px 22px;
      border-radius: 25px;
      display: inline-block;
      box-shadow: 0 0 20px rgba(255, 75, 130, 0.6);
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.96); }
    }

    /* Realistic Love Letter Modal */
    .letter-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(80, 20, 40, 0.8);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .letter-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Realistic Parchment Paper */
    .paper {
      background: #fffdf9;
      background-image: 
        radial-gradient(circle at 50% 50%, #ffffff 0%, #fae8ee 100%),
        repeating-linear-gradient(0deg, transparent, transparent 33px, rgba(255, 117, 140, 0.1) 34px);
      padding: 45px 35px 60px 35px;
      border-radius: 12px;
      max-width: 450px;
      width: 88%;
      position: relative;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.4),
        0 0 30px rgba(255, 75, 130, 0.3),
        inset 0 0 60px rgba(255, 182, 193, 0.3);
      border: 1px solid #f8b1c1;
      transform: scale(0.7) rotate(-2deg);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      line-height: 2.2;
      color: #4a2832;
    }

    .letter-modal.active .paper {
      transform: scale(1) rotate(-1deg);
    }

    .paper h3 {
      color: #d6336c;
      margin-bottom: 20px;
      text-align: left;
      font-size: 1.55rem;
      font-weight: 700;
      border-bottom: 2px dashed rgba(214, 51, 108, 0.3);
      padding-bottom: 10px;
    }

    .paper p {
      font-size: 1.08rem;
      font-weight: 500;
      text-indent: 24px;
    }

    .paper .signature {
      margin-top: 25px;
      text-align: right;
      font-weight: 700;
      color: #d6336c;
      font-size: 1.15rem;
    }

    /* 3D Wax Seal Stamp */
    .wax-seal {
      position: absolute;
      bottom: 20px;
      right: 25px;
      width: 58px;
      height: 58px;
      background: radial-gradient(circle at 35% 35%, #ff758c, #c9184a);
      border-radius: 50%;
      box-shadow: 
        0 6px 15px rgba(0,0,0,0.3), 
        inset 0 3px 6px rgba(255,255,255,0.5),
        inset 0 -3px 6px rgba(0,0,0,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      transform: rotate(15deg);
      border: 2px solid #a51c30;
    }

    .wax-seal::after {
      content: '❤️';
      font-size: 22px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Floating Hearts Background Container -->
  <div id="hearts-bg"></div>

  <!-- Step 1: Initial Screen -->
  <div id="step1" class="container">
    <h2>Yoo!! Crush လေးရေ<br>Click Here❤️</h2>
    <img 
      src="https://media.tenor.com/Ye1YuAsf2c0AAAAi/bubu-dudu.gif" 
      alt="Click Me" 
      class="gif-btn" 
      onclick="goToStep2()"
    >
  </div>

  <!-- Step 2: Proposal Screen -->
  <div id="step2" class="container hidden">
    <h2>အဲ့ဘက်မှာအေးလား <br>နွေးထွေးပေးမယ်လေ ပြန်ချစ်ပေးပါလား</h2>
    <img 
      src="https://media.tenor.com/OFV8jy2OuwYAAAAi/bibimbaobei-bububaobei.gif" 
      alt="Please Love Me" 
      class="gif-btn"
    >
    <div class="btn-group">
      <button id="yesBtn" class="btn btn-yes" onclick="handleYes()">Yes 💖</button>
      <button class="btn btn-no" onclick="handleNo()">No 💔</button>
    </div>
  </div>

  <!-- Step 3: Falling GIF -->
  <div id="falling-gif-box" class="falling-container hidden" onclick="openLetter()">
    <img 
      src="https://i.ibb.co/23wQNBnN/download-4.png" 
      alt="Falling Gift" 
      class="falling-gif"
    >
    <br>
    <div class="click-hint">✨ ဒီမှာ နှိပ်ကြည့်ပါ ✨</div>
  </div>

  <!-- Step 4: Parchment Love Letter -->
  <div id="letter-modal" class="letter-modal">
    <div class="paper">
      <h3>💌 To You</h3>
      <p>
        မင်းနဲ့ စကားပြောရတဲ့ စက္ကန့်တိုင်းက ငါ့အတွက်တော့ တစ်နေ့တာရဲ့ အလှပဆုံး အချိန်လေးပဲ။ မင်းကို ငါ တကယ် သဘောကျမိနေပြီ။ 
      </p>
      <br>
      <p>
        ငါ့ရဲ့ ဒီခံစားချက်လေးကို လက်ခံပေးနိုင်မလား...❤️✨
      </p>
      <div class="signature">Forever... 💖</div>

      <!-- 3D Wax Seal Stamp -->
      <div class="wax-seal"></div>
    </div>
  </div>

  <script>
    // Create floating heart particles
    function createHearts() {
      const heartsContainer = document.getElementById('hearts-bg');
      const heartIcons = ['❤️', '💖', '💕', '✨', '🌸', '💫'];
      for (let i = 0; i < 22; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
        heart.style.left = `${Math.random() * 100}vw`;
        heart.style.animationDelay = `${Math.random() * 7}s`;
        heart.style.fontSize = `${14 + Math.random() * 18}px`;
        heartsContainer.appendChild(heart);
      }
    }
    createHearts();

    // Random Sad Messages for No Button
    const sadMessages = [
      "တကယ် မချစ်ဘူးလားဟင်... 🥺",
      "နည်းနည်းလေးတောင် မချစ်ဘူးလား💔",
      "ငိုရတော့မှာပဲ... 😭",
      "တစ်ခါလောက်ပဲ အခွင့်အရေးပေးပါ... 🙏",
      "မရဘူး... Yes ပဲ နှိပ်ရမယ်နော်! 😜"
    ];

    let messageIndex = 0;
    let yesScale = 1;
    let noClickCount = 0;

    function goToStep2() {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
    }

    function handleNo() {
      noClickCount++;

      const textElem = document.createElement('div');
      textElem.className = 'sad-text';
      textElem.innerText = sadMessages[messageIndex];

      const padding = 30;
      const x = Math.random() * (window.innerWidth - 270) + padding;
      const y = Math.random() * (window.innerHeight - 120) + padding;

      textElem.style.left = `${Math.max(10, Math.min(x, window.innerWidth - 280))}px`;
      textElem.style.top = `${Math.max(10, Math.min(y, window.innerHeight - 80))}px`;

      document.body.appendChild(textElem);
      messageIndex = (messageIndex + 1) % sadMessages.length;

      yesScale += 0.25;
      const yesBtn = document.getElementById('yesBtn');
      yesBtn.style.fontSize = `${1.15 * yesScale}rem`;
      yesBtn.style.padding = `${14 * yesScale}px ${36 * yesScale}px`;
    }

    function handleYes() {
      fetch('', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          Answer: "YES 💖 (ပြန်ချစ်ပေးလိုက်ပါပြီ)",
          No_Clicked_Times: noClickCount + " ကြိမ်",
          Message: `Crush သည် No ခလုတ်ကို ${noClickCount} ကြိမ် နှိပ်ပြီးမှ Yes ကို နှိပ်သွားပါသည်။`
        })
      }).catch(err => console.log("Submission Error: ", err));

      document.getElementById('step2').classList.add('hidden');

      const sadTexts = document.querySelectorAll('.sad-text');
      sadTexts.forEach(el => el.remove());

      const fallingBox = document.getElementById('falling-gif-box');
      fallingBox.classList.remove('hidden');
    }

    function openLetter() {
      const modal = document.getElementById('letter-modal');
      modal.classList.add('active');
    }
  </script>
</body>
</html>
